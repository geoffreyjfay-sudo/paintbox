<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paintbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-left">
      <button class="back-btn hidden" id="back-btn">&#8592; Palettes</button>
      <div>
        <h1>Paintbox</h1>
        <p class="subtitle" id="header-subtitle">Your watercolour palettes</p>
      </div>
    </div>
  </header>

  <main>

    <!-- Home: list of saved palettes -->
    <section id="home-section">
      <div class="home-actions">
        <button class="new-palette-btn" id="new-palette-btn">+ New palette</button>
      </div>
      <div class="palette-list" id="palette-list">
        <!-- Palette cards injected here -->
      </div>
      <p class="empty-state hidden" id="empty-state">No palettes yet. Create your first one.</p>
    </section>

    <!-- New palette setup: name + size -->
    <section id="setup-section" class="hidden">
      <div class="setup-card">
        <h2 id="setup-title">New palette</h2>
        <p class="copy-notice hidden" id="copy-notice"></p>
        <label for="palette-name-input">Name</label>
        <input type="text" id="palette-name-input" placeholder="e.g. Daniel Smith Travel Set" maxlength="60" />
        <label>Size</label>
        <div class="size-options" id="size-options">
          <button class="size-btn" data-size="8">8</button>
          <button class="size-btn" data-size="16">16</button>
          <button class="size-btn selected" data-size="24">24</button>
          <button class="size-btn" data-size="32">32</button>
          <button class="size-btn" data-size="48">48</button>
        </div>
        <button id="create-btn" disabled>Create &amp; upload swatches</button>
      </div>
    </section>

    <!-- Step 1: Upload swatch photo -->
    <section id="upload-section" class="hidden">
      <div class="upload-area" id="upload-area">
        <input type="file" id="file-input" accept="image/*" hidden />
        <div class="upload-prompt">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <p>Upload your swatch photo</p>
          <span>Click or drag an image here</span>
        </div>
      </div>
    </section>

    <!-- Step 2: Sample colours from photo -->
    <section id="sample-section" class="hidden">
      <div class="sample-layout">

        <div class="canvas-wrapper">
          <p class="instruction">Click a swatch on the photo to sample its colour</p>
          <canvas id="swatch-canvas"></canvas>
        </div>

        <div class="sidebar">

          <!-- Colour preview + naming -->
          <div class="colour-picker-panel">
            <div class="colour-preview" id="colour-preview"></div>
            <div class="colour-hex" id="colour-hex">—</div>
            <input type="text" id="colour-name" placeholder="Name this colour…" maxlength="40" disabled />
            <button id="add-btn" disabled>Add to palette</button>
          </div>

          <!-- Palette being built -->
          <div class="palette-panel">
            <div class="palette-header">
              <span id="palette-title">Palette</span>
              <span class="palette-count" id="palette-count">0 / 24</span>
            </div>
            <div class="palette-grid" id="palette-grid"></div>
            <button id="done-btn" class="done-btn hidden">Done</button>
          </div>

        </div>
      </div>
    </section>

  </main>

  <!-- Toast notification -->
  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
